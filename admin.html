<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.png"><title>پنل مدیریت بُزینو</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#f6efe3;color:#2b1a12}nav{background:#2b1a12;padding:.7rem;display:flex;gap:.5rem;flex-wrap:wrap}nav button{background:#b8935a}main{padding:1rem;max-width:1100px;margin:auto}
button{background:#2b1a12;color:#f6efe3;border:0;border-radius:8px;padding:.5rem .8rem;font:inherit;cursor:pointer}input,select,textarea{padding:.5rem;border:1px solid #cdbba0;border-radius:8px;font:inherit;width:100%;margin:.2rem 0}.card{background:#fff;border-radius:12px;padding:1rem;margin:.6rem 0;box-shadow:0 1px 6px #0002}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem}td,th{padding:.4rem;border-bottom:1px solid #ddd;text-align:start}table{width:100%}.ltr{direction:ltr}.new{border-inline-start:6px solid #d33}</style></head><body>
<div style="text-align:center;padding:.6rem"><img src="/logo.png" alt="BOZINO" style="height:70px;border-radius:50%"></div><div id="app"></div><script>
const $=i=>document.getElementById(i),f=n=>Number(n).toLocaleString('fa-IR'),T=n=>f(n)+' تومان';let tk=sessionStorage.at||'',tab='orders',seen=null;
const api=(p,b)=>fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+tk},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json();if(!r.ok){if(r.status==401){tk='';draw()}throw j.error}return j});
const ST=['سفارش جدید','تأیید شده','در حال آماده‌سازی','آماده ارسال','تحویل پیک','تحویل مشتری','لغوشده'];let sound=false;
function draw(){if(!tk){$('app').innerHTML=`<main><div class="card"><h2>ورود مدیر</h2><input id="pw" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button></div></main>`;return}
$('app').innerHTML=`<nav>${[['orders','سفارش‌ها'],['products','محصولات'],['customers','مشتریان'],['reports','گزارش‌ها'],['settings','تنظیمات'],['coupons','کد تخفیف']].map(t=>`<button onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('')}<button onclick="sound=!sound;alert(sound?'صدا فعال شد':'صدا خاموش شد')">🔔 صدا</button><a style="color:#fff;margin-inline-start:auto" href="#" onclick="dl('export','orders.csv')">خروجی اکسل (CSV)</a><a style="color:#fff" href="#" onclick="dl('backup','bozino-backup.db')">پشتیبان‌گیری</a></nav><main id="m"></main>`;V[tab]()}
async function dl(p,n){const r=await fetch('/api/admin/'+p,{headers:{authorization:'Bearer '+tk}}),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=n;a.click()}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});if(!r.ok)throw 0;tk=(await r.json()).token;sessionStorage.at=tk;draw()}catch{alert('رمز نادرست')}}
const V={async orders(){const o=await api('orders');$('m').innerHTML=o.map(x=>`<div class="card ${x.status=='سفارش جدید'?'new':''}"><b>${x.code}</b> · مشتری ${x.customer_code} · ${x.name} · <span class="ltr">${x.phone}</span> · ${x.created}<br>${x.address} (${x.hood}) <a target="_blank" href="https://www.openstreetmap.org/?mlat=${x.lat}&mlon=${x.lng}#map=17/${x.lat}/${x.lng}">نقشه</a><br>${x.items.map(i=>`${i.name} ×${f(i.qty)} (${f(i.arabica)}٪ عربیکا / ${f(i.robusta)}٪ روبوستا)`).join('، ')}<br>محصولات ${T(x.subtotal)} + ارسال ${T(x.delivery)} − تخفیف ${T(x.discount)} = <b>${T(x.total)}</b> · ${x.method} · ETA ${f(x.eta_min)} دقیقه${x.note?`<br>توضیح: ${x.note}`:''}<br>
<select onchange="api('order',{id:${x.id},status:this.value})">${ST.map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select> <label><input type="checkbox" style="width:auto" ${x.paid?'checked':''} onchange="api('order',{id:${x.id},paid:this.checked})"> پرداخت‌شده</label> <button onclick="inv(${x.id})">چاپ فاکتور</button></div>`).join('')||'سفارشی نیست';window.O=o;
const n=o.filter(x=>x.status=='سفارش جدید').length;if(seen!==null&&n>seen&&sound)new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play().catch(()=>{}),beep();seen=n},
async products(){const p=await api('products');$('m').innerHTML=`<button onclick="pf({})">+ محصول جدید</button><div class="g">${p.map(x=>`<div class="card"><b>${x.name}</b> (${x.category})<br>${T(x.price)} · ${x.available?'موجود':'ناموجود'}<br><button onclick='pf(${JSON.stringify(x).replace(/'/g,"&#39;")})'>ویرایش</button> <button onclick="if(confirm('حذف شود؟'))api('product',{id:${x.id},delete:1}).then(draw)">حذف</button></div>`).join('')}</div><div id="pfm"></div>`},
async customers(){$('m').innerHTML=`<input id="cq" placeholder="جستجو با کد، نام یا تلفن" oninput="cs()"><div id="cr"></div>`;cs()},
async reports(){const r=await api('reports');$('m').innerHTML=`<div class="card">تعداد سفارش‌ها: ${f(r.count)}<br>مجموع فروش: ${T(r.total)}<br>دریافت‌شده: ${T(r.paid)}<br>پرداخت‌نشده: ${T(r.unpaid)} (${f(r.unpaid_count)} سفارش)<br>مجموع هزینهٔ ارسال: ${T(r.delivery)}<h4>پرفروش‌ها</h4>${r.top.map(t=>`${t[0]}: ${f(t[1])}`).join('<br>')}</div>`},
async settings(){const s=await api('settings');const L={cafe_lat:'عرض جغرافیایی کافه',cafe_lng:'طول جغرافیایی کافه',base_fee:'هزینهٔ پایه ارسال (تومان)',per_km:'هزینهٔ هر کیلومتر',min_fee:'حداقل هزینه ارسال',max_km:'حداکثر محدودهٔ ارسال (کیلومتر)',free_over:'ارسال رایگان بالاتر از (۰=غیرفعال)',min_order:'حداقل مبلغ سفارش',open:'سفارش‌گیری فعال (۱/۰)',notice:'اطلاعیهٔ تعطیلی',open_hour:'ساعت شروع',close_hour:'ساعت پایان',per_order_queue_min:'دقیقه به‌ازای هر سفارش در صف',travel_min_per_km:'دقیقه مسیر پیک به‌ازای هر کیلومتر',blends_custom:'درصد دلخواه عربیکا (۱/۰)',telegram_token:'توکن ربات تلگرام',telegram_chat:'شناسهٔ چت تلگرام مدیر'};
$('m').innerHTML=`<div class="card g">${Object.keys(L).map(k=>`<label>${L[k]}<input data-k="${k}" value="${s[k]}"></label>`).join('')}</div><button onclick="ss()">ذخیره</button>`},
async coupons(){const c=await api('coupons');$('m').innerHTML=`<div class="card">${c.map(x=>`${x.code}: ${f(x.percent)}٪ <button onclick="api('coupons',{code:'${x.code}',delete:1}).then(draw)">حذف</button><br>`).join('')}<input id="cc1" placeholder="کد"><input id="cc2" type="number" placeholder="درصد"><button onclick="api('coupons',{code:cc1.value,percent:cc2.value}).then(draw)">افزودن</button></div>`}};
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(()=>o.stop(),400)}catch{}}
async function cs(){const c=await api('customers?q='+encodeURIComponent($('cq').value));$('cr').innerHTML=`<table><tr><th>کد</th><th>نام</th><th>تلفن</th><th>سفارش</th><th>مجموع خرید</th><th>آدرس‌ها</th></tr>${c.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td class="ltr">${x.phone}</td><td>${f(x.orders)}</td><td>${T(x.spent)}</td><td>${JSON.parse(x.addresses).map(a=>a.address).join('<hr>')}</td></tr>`).join('')}</table>`}
async function ss(){const b={};document.querySelectorAll('[data-k]').forEach(e=>{const v=e.value;b[e.dataset.k]=v!==''&&!isNaN(v)?+v:v});await api('settings',b);alert('ذخیره شد')}
function pf(p){$('pfm').innerHTML=`<div class="card"><input id="pn" placeholder="نام" value="${p.name||''}"><input id="pd" placeholder="توضیحات" value="${p.description||''}"><input id="pp" type="number" placeholder="قیمت (تومان)" value="${p.price||''}"><input id="pc" placeholder="دسته‌بندی" value="${p.category||''}"><input id="pm" type="number" placeholder="زمان آماده‌سازی (دقیقه)" value="${p.prep_min||5}">
<input id="pb" class="ltr" placeholder="ترکیب‌های مجاز: 100:0,70:30" value="${(p.blends||[[100,0],[70,30],[50,50],[30,70],[0,100]]).map(b=>b.join(':')).join(',')}"><input type="file" id="pi" accept="image/*"><label><input type="checkbox" id="pa" style="width:auto" ${p.available!==false?'checked':''}> موجود</label><br><button onclick='sp(${p.id||0},${JSON.stringify(p.image||'')})'>ذخیره</button></div>`}
async function sp(id,img){const fl=$('pi').files[0];if(fl)img=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(fl)});
await api('product',{id:id||undefined,name:$('pn').value,description:$('pd').value,price:$('pp').value,category:$('pc').value,prep_min:$('pm').value,image:img,available:$('pa').checked,blends:$('pb').value.split(',').map(s=>s.split(':').map(Number)).filter(b=>b[0]+b[1]==100)});draw()}
function inv(id){const x=window.O.find(o=>o.id==id),w=open('');w.document.write(`<html dir="rtl"><body style="font-family:Tahoma"><h2>فاکتور بُزینو</h2>کد: ${x.code}<br>${x.name} - ${x.phone}<br>${x.address}<hr>${x.items.map(i=>`${i.name} ×${f(i.qty)} (${f(i.arabica)}٪ عربیکا) — ${T(i.price*i.qty)}`).join('<br>')}<hr>ارسال: ${T(x.delivery)}<br>تخفیف: ${T(x.discount)}<br><b>جمع: ${T(x.total)}</b><br>${x.created}</body></html>`);w.print()}
setInterval(()=>{if(tk&&tab=='orders'&&document.activeElement.tagName!='SELECT')V.orders().catch(()=>{})},15000);draw();
</script></body></html>
